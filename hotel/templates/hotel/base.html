<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Inu no Hoteru 犬のホテル{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    nav a { margin-right: 1rem; }
    .nota { color: #666; margin-top: 0; }
    .error { color: #b00020; }
    ul.lista { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .5rem; }
    ul.lista li { border: 1px solid #ccc; border-radius: 8px; padding: .6rem .8rem; display: flex; justify-content: space-between; gap: .5rem; }
    form.filtros { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin: 1rem 0; }
    label { display: flex; flex-direction: column; font-size: .9rem; color: #555; }
    input, button { font: inherit; padding: .4rem .6rem; }
    button { border: 2px solid #1a73e8; background: #e8f0fe; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Inu no Hoteru 犬のホテル</h1>
  <nav><a href="{% url 'inicio' %}">Habitaciones</a><a href="{% url 'disponibilidad' %}">Disponibilidad</a></nav>
  <p class="nota">Prototipo conceptual con datos de ejemplo.</p>
  {% block contenido %}{% endblock %}
</body>
</html>
