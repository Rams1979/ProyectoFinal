<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Inu no Hoteru 犬のホテル{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    nav a { margin-right: 1rem; }
    .nota { color: #666; margin-top: 0; }
    .error { color: #b00020; }
    ul.lista { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .5rem; }
    ul.lista li { border: 1px solid #ccc; border-radius: 8px; padding: .6rem .8rem; display: flex; justify-content: space-between; gap: .5rem; }
    form.filtros { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin: 1rem 0; }
    label { display: flex; flex-direction: column; font-size: .9rem; color: #555; }
    input, button { font: inherit; padding: .4rem .6rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #ddd; }
    th { background: #f3f3f0; }
    a.boton { border: 2px solid #1a73e8; background: #e8f0fe; border-radius: 6px; padding: .25rem .6rem; font-weight: 600; text-decoration: none; color: #222; }
    #msgs { border: 1px solid #ccc; border-radius: 8px; padding: .6rem; min-height: 240px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
    .burbuja { padding: .5rem .75rem; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .yo { align-self: flex-end; background: #e8f0fe; border: 1px solid #1a73e8; }
    .bot { align-self: flex-start; background: #f3f3f0; border: 1px solid #ccc; }
    .panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .6rem; list-style: none; padding: 0; }
    .panel li { border: 2px solid #ccc; border-radius: 8px; padding: .5rem .6rem; font-size: .9rem; display: flex; flex-direction: column; gap: .25rem; }
    .panel li.ocupada { border-color: #1a73e8; background: #e8f0fe; }
    .panel li.llega { border-color: #b26a00; background: #fff4e0; }
    .panel li.limpieza { border-color: #777; background: #f0f0f0; border-style: dashed; }
    .panel li.libre { border-color: #2e7d32; }
    .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; list-style: none; padding: 0; }
    .menu a { display: flex; flex-direction: column; gap: .3rem; border: 2px solid #1a73e8; border-radius: 8px; padding: .8rem; text-decoration: none; color: inherit; height: 100%; box-sizing: border-box; }
    .menu a:hover { background: #e8f0fe; }
    .menu strong { font-size: 1.1rem; }
    .menu small { color: #555; }
    .resumen { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; margin: .5rem 0 1rem; }
    .resumen strong { font-size: 1.3rem; }
    form.en-linea { display: inline; margin: 0; }
    button.chico { padding: .15rem .5rem; font-size: .85rem; }
    button { border: 2px solid #1a73e8; background: #e8f0fe; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Inu no Hoteru 犬のホテル</h1>
  <nav>
    {% if rol %}
      <a href="{% url 'inicio' %}">Menú</a><a href="{% url 'disponibilidad' %}">Disponibilidad</a><a href="{% url 'panel' %}">Panel</a><a href="{% url 'reservaciones' %}">Reservaciones</a><a href="{% url 'clientes' %}">Clientes</a><a href="{% url 'chat' %}">Chat</a>{% if es_admin %}<a href="{% url 'solicitudes' %}">Solicitudes</a><a href="{% url 'usuarios' %}">Usuarios</a>{% endif %}
      <form class="en-linea" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="chico" type="submit">Salir ({{ user.username }} · {{ rol }})</button></form>
    {% else %}
      <a href="{% url 'inicio' %}">Inicio</a><a href="{% url 'disponibilidad' %}">Disponibilidad</a><a href="{% url 'chat' %}">Chat</a><a href="{% url 'login' %}">Ingreso del personal</a>
    {% endif %}
  </nav>
  <p class="nota">Prototipo conceptual con datos de ejemplo.</p>
  {% block contenido %}{% endblock %}
</body>
</html>
