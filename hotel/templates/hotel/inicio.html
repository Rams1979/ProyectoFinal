<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inu no Hoteru 犬のホテル</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    .nota { color: #666; margin-top: 0; }
    ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .5rem; }
    li { border: 1px solid #ccc; border-radius: 8px; padding: .6rem .8rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>Inu no Hoteru 犬のホテル</h1>
  <p class="nota">Prototipo conceptual con datos de ejemplo. Etapa 0: fundamentos.</p>
  <h2>Habitaciones ({{ habitaciones|length }})</h2>
  <ul>
    {% for h in habitaciones %}
      <li><span>{{ h }}</span><span>${{ h.tarifa_noche|floatformat:0 }} por noche</span></li>
    {% empty %}
      <li>No hay habitaciones cargadas.</li>
    {% endfor %}
  </ul>
</body>
</html>
