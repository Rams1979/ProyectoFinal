{% extends "hotel/base.html" %}
{% block contenido %}
  <h2>Nuevo cliente</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="filtros" method="post">
    {% csrf_token %}
    <label>Nombre completo <input name="nombre" value="{{ datos.nombre }}" required></label>
    <label>Teléfono <input name="telefono" value="{{ datos.telefono }}" required></label>
    <label>Correo (opcional) <input type="email" name="correo" value="{{ datos.correo }}"></label>
    <button type="submit">Guardar</button>
  </form>
  <p><a href="{% url 'clientes' %}">Volver a clientes</a></p>
{% endblock %}
