{% extends "hotel/base.html" %}
{% load static %}
{% block contenido %}
  <img class="logo-grande" src="{% static logo %}" alt="Inu no Hoteru 犬のホテル, hotel para perros">
  <h2>Ingreso del personal</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="filtros" method="post">
    {% csrf_token %}
    <label>Usuario <input name="username" autocomplete="username" required autofocus></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Ingresar</button>
  </form>
{% endblock %}
